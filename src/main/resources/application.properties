spring.application.name=periferia

server.address=0.0.0.0
server.port=${PORT:8181}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/periferiadb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET:periferia-jwt-secret-key-change-this-in-production-256bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

